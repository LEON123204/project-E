<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a3ae"/>
      <stop offset="40%" stop-color="#6D2932"/>
      <stop offset="100%" stop-color="#561C24"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a3ae" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6D2932" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#561C24" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6D2932" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="8"/>
  <!-- Ambient glow -->
  <path d="M 290 80 L 160 270 H 270 L 220 432 L 352 242 H 242 Z" fill="#6D2932" opacity="0.35" filter="url(#glow)"/>
  <!-- Sharp Power Bolt Icon -->
  <path d="M 290 80 L 160 270 H 270 L 220 432 L 352 242 H 242 Z" fill="url(#boltGrad)" filter="url(#dropShadow)"/>
  <!-- Highlight edge -->
  <path d="M 290 80 L 160 270 H 270" fill="none" stroke="#e8a3ae" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
